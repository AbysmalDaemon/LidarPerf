<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">LidarPerf validation snapshot</title>
  <desc id="desc">Real KISS-ICP and Hilti 2022 basement_2 validation evidence from LidarPerf Steps 9 through 11. Accuracy is comparable; strict performance and regression comparison are rejected on GitHub-hosted runners.</desc>
  <rect width="1200" height="680" rx="24" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="678" rx="23" fill="none" stroke="#d9e2ec" stroke-width="2"/>

  <text x="52" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#102a43">LidarPerf validation snapshot</text>
  <text x="52" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#486581">KISS-ICP · Hilti 2022 basement_2 · real evidence from Steps 9–11</text>

  <text x="52" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#243b53">Semantic comparison</text>

  <rect x="52" y="174" width="500" height="70" rx="12" fill="#e6f6ec" stroke="#9fd5b2"/>
  <circle cx="88" cy="209" r="15" fill="#1f8f4e"/>
  <path d="M81 209l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="216" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#102a43">Accuracy comparable</text>
  <text x="510" y="216" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f8f4e">YES</text>

  <rect x="52" y="258" width="500" height="70" rx="12" fill="#fff1f1" stroke="#efb3b3"/>
  <circle cx="88" cy="293" r="15" fill="#c23b3b"/>
  <path d="M82 287l12 12M94 287l-12 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#102a43">Performance comparable</text>
  <text x="510" y="300" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#c23b3b">NO</text>

  <rect x="52" y="342" width="500" height="70" rx="12" fill="#fff1f1" stroke="#efb3b3"/>
  <circle cx="88" cy="377" r="15" fill="#c23b3b"/>
  <path d="M82 371l12 12M94 371l-12 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#102a43">Performance authoritative</text>
  <text x="510" y="384" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#c23b3b">NO</text>

  <rect x="52" y="426" width="500" height="70" rx="12" fill="#fff1f1" stroke="#efb3b3"/>
  <circle cx="88" cy="461" r="15" fill="#c23b3b"/>
  <path d="M82 455l12 12M94 455l-12 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#102a43">Regression comparable</text>
  <text x="510" y="468" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#c23b3b">NO</text>

  <text x="610" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#243b53">Observed real results</text>

  <rect x="610" y="174" width="250" height="132" rx="14" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="632" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#486581">APE TRANSLATION RMSE</text>
  <text x="632" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">0.3375 m</text>
  <text x="632" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#627d98">Step 9 = Step 10</text>

  <rect x="878" y="174" width="270" height="132" rx="14" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="900" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#486581">APE ROTATION RMSE</text>
  <text x="900" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">47.90°</text>
  <text x="900" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#627d98">Step 9 = Step 10</text>

  <rect x="610" y="324" width="250" height="132" rx="14" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="632" y="354" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#486581">STEP 10 REPEATS</text>
  <text x="632" y="396" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">5 / 5</text>
  <text x="632" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#627d98">measured trials successful</text>

  <rect x="878" y="324" width="270" height="132" rx="14" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="900" y="354" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#486581">TRAJECTORY REPEATABILITY</text>
  <text x="900" y="396" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">0.0 m</text>
  <text x="900" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#627d98">pairwise translation RMSE</text>

  <rect x="610" y="474" width="538" height="92" rx="14" fill="#eef6ff" stroke="#b8d5f3"/>
  <text x="632" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#486581">HOSTED TIMING — DESCRIPTIVE ONLY</text>
  <text x="632" y="541" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#102a43">3.5747 s median wall time</text>
  <text x="1122" y="541" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#627d98">5 measured trials</text>

  <line x1="52" y1="602" x2="1148" y2="602" stroke="#d9e2ec"/>
  <text x="52" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#486581">Why the red rows? GitHub-hosted runners do not establish stable physical-host identity, explicit matched CPU allocation, or paired controlled execution.</text>
  <text x="52" y="654" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#829ab1">This visual demonstrates LidarPerf's evidence and comparability logic, not a publication-grade ranking of KISS-ICP. The short-prefix rotation APE remains a known caveat.</text>
</svg>
