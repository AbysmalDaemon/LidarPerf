name: Step 9 finalize execution log

on:
  push:
    branches: [step9-end-to-end]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step9-end-to-end
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation toolchain
        run: python -m pip install -e '.[dev]'
      - name: Append Step 9 record
        run: |
          if ! grep -Fq '## Project execution log — 2026-09-14 — Step 9 first complete real `.lperf` run' LidarPerf_research_execution_plan.md; then
            printf '\n\n' >> LidarPerf_research_execution_plan.md
            cat docs/step9_execution_log_append.md >> LidarPerf_research_execution_plan.md
          fi
      - name: Remove one-shot staging files
        run: |
          git rm .github/workflows/step9-finalize-log.yml
          git rm docs/step9_execution_log_append.md
      - name: Validate final branch content
        run: |
          git diff --check
          ruff check .
          pytest
          lidarperf verify docs/validation/step9_kiss_hilti.lperf
      - name: Commit durable log
        run: |
          git add LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Step 9 end-to-end evidence'
          git push
