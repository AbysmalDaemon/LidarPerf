name: Step 15 format
on:
  push:
    branches: [step15-docker-backend]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-docker-backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Wrap lines Ruff cannot auto-fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/backends/docker.py')
          text = path.read_text()
          text = text.replace(
              '        item for item in repo_digests if "@" in item and _SHA256_RE.fullmatch(item.rsplit("@", 1)[1])\n',
              '        item\n        for item in repo_digests\n        if "@" in item and _SHA256_RE.fullmatch(item.rsplit("@", 1)[1])\n',
          )
          text = text.replace(
              '        if not isinstance(repo_digests, list) or not all(isinstance(item, str) for item in repo_digests):\n',
              '        if not isinstance(repo_digests, list) or not all(\n            isinstance(item, str) for item in repo_digests\n        ):\n',
          )
          path.write_text(text)

          path = Path('tests/backends/test_docker.py')
          text = path.read_text()
          text = text.replace(
              '    provenance = DockerBackend("/usr/bin/docker", runner=runner).inspect_image("example/estimator:1")\n',
              '    provenance = DockerBackend("/usr/bin/docker", runner=runner).inspect_image(\n        "example/estimator:1"\n    )\n',
          )
          path.write_text(text)
          PY
      - run: ruff check --fix src/lidarperf/backends/docker.py tests/backends/test_docker.py
      - run: ruff format src/lidarperf/backends/docker.py tests/backends/test_docker.py
      - run: ruff check .
      - run: pytest
      - name: Commit formatted Step 15 tree
        run: |
          rm .github/workflows/step15-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: format Docker backend and tests'
          git push origin HEAD:step15-docker-backend
