name: Step 9 BenchExec delegated-scope probe

on:
  push:
    branches: [step9-end-to-end]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BenchExec Ubuntu package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
      - name: Repair hosted-runner cpuset delegation and verify scope
        run: |
          uid="$(id -u)"
          parent="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service/cgroup.subtree_control"
          echo +cpuset | sudo tee "$parent"
          systemd-run --user --scope --slice=benchexec -p Delegate=yes \
            bash -lc 'python3 -m benchexec.check_cgroups && runexec --no-container --output /tmp/probe.log -- /bin/true && cat /tmp/probe.log'
