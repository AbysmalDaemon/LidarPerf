name: Pre-PR Step 6

on:
  push:
    branches: [benchexec-backend]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,benchmark]'
      - name: BenchExec package smoke
        run: runexec --version
      - name: Real runexec smoke
        run: |
          runexec --no-container --output /tmp/lidarperf-runexec-smoke.log -- /usr/bin/true \
            | tee /tmp/lidarperf-runexec-measurements.txt
          grep '^returnvalue=0$' /tmp/lidarperf-runexec-measurements.txt
          grep '^walltime=' /tmp/lidarperf-runexec-measurements.txt
          grep '^cputime=' /tmp/lidarperf-runexec-measurements.txt
          grep '^memory=' /tmp/lidarperf-runexec-measurements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
