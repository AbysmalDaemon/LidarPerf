name: Pre-PR Step 6

on:
  push:
    branches: [benchexec-backend]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,benchmark]'
      - name: BenchExec package smoke
        run: runexec --version
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
