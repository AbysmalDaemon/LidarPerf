name: Step 12 closure retry

on:
  push:
    branches: [step12-regression-engine]
    paths:
      - '.github/workflows/step12-finalize-retry.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step12-regression-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate and generate evidence
        run: |
          ruff check .
          pytest -q
          python scripts/run_step12_validation.py
          set +e
          lidarperf regress \
            docs/validation/step9_kiss_hilti.lperf \
            docs/validation/step10_kiss_hilti_repeated.lperf \
            --policy docs/examples/regression_policy.example.yaml \
            --json > /tmp/step12-real.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/step12-real.json').read_text())
          assert report['verdict'] == 'NOT_COMPARABLE'
          evidence = json.loads(Path('docs/validation/step12_regression_engine.json').read_text())
          scenarios = evidence['synthetic_decision_scenarios']
          assert scenarios['pass']['verdict'] == 'PASS'
          assert scenarios['performance_regression']['verdict'] == 'FAIL_PERFORMANCE'
          assert scenarios['accuracy_regression_even_when_faster']['verdict'] == 'FAIL_ACCURACY'
          assert scenarios['uncertainty_crosses_threshold']['verdict'] == 'INCONCLUSIVE'
          PY
      - name: Update permanent documentation
        run: python scripts/_step12_finalize.py
      - name: Remove scaffolding and revalidate permanent tree
        run: |
          git rm \
            .github/workflows/step12-finalize.yml \
            .github/workflows/step12-finalize-retry.yml \
            scripts/_step12_finalize.py
          ruff check .
          pytest -q
          python scripts/run_step12_validation.py
      - name: Commit closure
        run: |
          git add \
            README.md \
            LidarPerf_research_execution_plan.md \
            docs/validation/README.md \
            docs/validation/step12_regression_engine.json \
            scripts/run_step12_validation.py \
            tests/test_cli.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Step 12 regression engine'
          git push origin HEAD:step12-regression-engine
