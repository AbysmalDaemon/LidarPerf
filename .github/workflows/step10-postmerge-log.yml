name: Step 10 post-merge history closure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  close-log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Append closure to living project record
        run: |
          printf '%s\n' '' '### Step 10 post-merge closure — 2026-09-14' '' '- PR #11 was squash-merged as 79e6e840a68f6b8f4a8393bd39ddd2167143c6bf.' '- Post-merge main CI run 34900803913 passed on Python 3.11, 3.12, and 3.13.' '- Final validation before merge collected 134 tests; all 134 passed, Ruff passed, and the repeated bundle verified VALID.' '- A final evidence-packaging trap was discovered after semantic cleanup: .lperf directories are gitignored, so renaming the validated controlled-named directory to the exploratory repeated name succeeded in the workflow worktree but git add -A recorded only the deletion. The already-successful bundle was restored from Git history, relabeled exploratory, checksums regenerated, independently verified, and force-added without rerunning the 6.3 GB Hilti download or estimator trials.' '- Durable Step 10 evidence is docs/validation/step10_kiss_hilti_repeated.lperf/ and remains explicitly non-authoritative for performance because it was produced on an ordinary GitHub-hosted runner.' '- Step 10 is complete. Step 11 comparator work is next; controlled real performance evidence is deferred until a stable controlled Linux host is available.' >> LidarPerf_research_execution_plan.md
      - name: Commit closure and remove one-shot workflow
        run: |
          git rm .github/workflows/step10-postmerge-log.yml
          git add LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Step 10 execution history'
          git push
