name: Step 12 format and validate

on:
  push:
    branches: [step12-regression-engine]
    paths:
      - '.github/workflows/step12-format.yml'

permissions:
  contents: write

jobs:
  format-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step12-regression-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Patch and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/regression.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          for line in lines:
              if 'is marked successful with exit_code=' in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(indent + 'f"{label} trial {trial.trial_index} is marked successful "')
                  output.append(indent + 'f"with exit_code={trial.exit_code}"')
              elif 'absolute maximum {gate.limit:.9g}' in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(indent + 'f"candidate {candidate:.9g} {\'<=\' if passed else \'>\'} "')
                  output.append(indent + 'f"absolute maximum {gate.limit:.9g}"')
              else:
                  output.append(line)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          ruff format src/lidarperf/regression.py src/lidarperf/cli.py tests/test_regression.py
          ruff check --fix src/lidarperf/regression.py src/lidarperf/cli.py tests/test_regression.py
      - name: Validate
        run: |
          ruff check .
          pytest -q
      - name: Commit formatted core and remove one-shot workflow
        run: |
          git rm .github/workflows/step12-format.yml
          git add src/lidarperf/regression.py src/lidarperf/cli.py tests/test_regression.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: format and validate Step 12 core'
          git push origin HEAD:step12-regression-engine
