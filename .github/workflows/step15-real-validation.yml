name: Step 15 real Docker validation
on:
  push:
    branches: [step15-docker-backend]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-docker-backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix Docker version probe delimiter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/backends/docker.py')
          text = path.read_text()
          text = text.replace(
              '"{{.Client.Version}}\\\\t{{.Server.Version}}",',
              '"{{.Client.Version}}|{{.Server.Version}}",',
          )
          text = text.replace(
              'fields = result.stdout.strip().split("\\t")',
              'fields = result.stdout.strip().split("|", 1)',
          )
          path.write_text(text)

          path = Path('tests/backends/test_docker.py')
          text = path.read_text().replace(
              '"27.3.1\\t27.3.1\\n"',
              '"27.3.1|27.3.1\\n"',
          )
          path.write_text(text)
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: docker version
      - run: docker pull alpine:3.20
      - run: python scripts/run_step15_docker_validation.py
      - run: ruff check .
      - run: pytest
      - name: Commit durable Step 15 Docker evidence
        run: |
          rm .github/workflows/step15-real-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate real Docker execution backend'
          git push origin HEAD:step15-docker-backend
