name: Step 9 BenchExec capability probe 2

on:
  push:
    branches: [step9-end-to-end]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BenchExec Ubuntu package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
      - name: Force cpuset delegation and verify runexec
        run: |
          uid="$(id -u)"
          base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
          echo +cpuset | sudo tee "$base/cgroup.subtree_control"
          echo +cpuset | sudo tee "$base/benchexec.slice/cgroup.subtree_control"
          python3 -m benchexec.check_cgroups
          runexec --no-container --output /tmp/probe.log -- /bin/true
          cat /tmp/probe.log
