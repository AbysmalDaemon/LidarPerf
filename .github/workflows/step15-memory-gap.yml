name: Step 15 memory-limit closure

on:
  push:
    branches: [step15-docker-backend]
    paths: [.github/workflows/step15-memory-gap.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-docker-backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Patch required memory-limit semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/backends/docker.py')
          text = path.read_text()
          old = '''    working_directory: str | None = None
    timeout_s: float | None = Field(default=None, gt=0)
'''
          new = '''    working_directory: str | None = None
    memory_limit_bytes: int | None = Field(default=None, gt=0)
    timeout_s: float | None = Field(default=None, gt=0)
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                "working_directory": self.spec.working_directory,
                "pull_policy": "never",
'''
          new = '''                "working_directory": self.spec.working_directory,
                "memory_limit_bytes": self.spec.memory_limit_bytes,
                "pull_policy": "never",
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if spec.cpu_cores:
            args.extend(("--cpuset-cpus", ",".join(str(core) for core in spec.cpu_cores)))
        if spec.gpu_access.mode == "all":
'''
          new = '''        if spec.cpu_cores:
            args.extend(("--cpuset-cpus", ",".join(str(core) for core in spec.cpu_cores)))
        if spec.memory_limit_bytes is not None:
            args.extend(("--memory", str(spec.memory_limit_bytes)))
        if spec.gpu_access.mode == "all":
'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/backends/test_docker.py')
          text = test.read_text()
          old = '''        cpu_cores=(3, 1, 3),
        gpu_access=DockerGpuAccess(mode="devices", device_ids=("0", "2")),
'''
          new = '''        cpu_cores=(3, 1, 3),
        memory_limit_bytes=536870912,
        gpu_access=DockerGpuAccess(mode="devices", device_ids=("0", "2")),
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    assert command[command.index("--cpuset-cpus") + 1] == "1,3"
    assert command[command.index("--gpus") + 1] == "device=0,2"
'''
          new = '''    assert command[command.index("--cpuset-cpus") + 1] == "1,3"
    assert command[command.index("--memory") + 1] == "536870912"
    assert command[command.index("--gpus") + 1] == "device=0,2"
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''        cpu_cores=(0, 1),
        network="none",
'''
          new = '''        cpu_cores=(0, 1),
        memory_limit_bytes=268435456,
        network="none",
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    assert metadata["container"]["cpu_allocation"] == [0, 1]
    assert metadata["container"]["gpu_access"] == {"mode": "none", "device_ids": []}
'''
          new = '''    assert metadata["container"]["cpu_allocation"] == [0, 1]
    assert metadata["container"]["memory_limit_bytes"] == 268435456
    assert metadata["container"]["gpu_access"] == {"mode": "none", "device_ids": []}
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    with pytest.raises(ValidationError, match="environment variable name"):
        DockerRunSpec(image="x", environment={"BAD-NAME": "1"})
'''
          new = '''    with pytest.raises(ValidationError):
        DockerRunSpec(image="x", memory_limit_bytes=0)
    with pytest.raises(ValidationError, match="environment variable name"):
        DockerRunSpec(image="x", environment={"BAD-NAME": "1"})
'''
          assert old in text
          text = text.replace(old, new, 1)
          test.write_text(text)

          script = Path('scripts/run_step15_docker_validation.py')
          text = script.read_text()
          old = '''        cpu_cores=cpu_cores,
        network="none",
'''
          new = '''        cpu_cores=cpu_cores,
        memory_limit_bytes=64 * 1024 * 1024,
        network="none",
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            "network_disabled": spec.network == "none",
            "immutable_runtime_image": result.image.repo_digest or result.image.image_id,
'''
          new = '''            "network_disabled": spec.network == "none",
            "memory_limit_bytes": spec.memory_limit_bytes,
            "immutable_runtime_image": result.image.repo_digest or result.image.image_id,
'''
          assert old in text
          text = text.replace(old, new, 1)
          script.write_text(text)
          PY
      - name: Format and test
        run: |
          ruff format src/lidarperf/backends/docker.py tests/backends/test_docker.py scripts/run_step15_docker_validation.py
          ruff check .
          pytest
      - name: Real Docker validation
        run: |
          docker pull alpine:3.20
          python scripts/run_step15_docker_validation.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/validation/step15_docker_backend.json').read_text())
          assert data['execution_metadata']['container']['memory_limit_bytes'] == 64 * 1024 * 1024
          assert data['validation']['memory_limit_bytes'] == 64 * 1024 * 1024
          assert data['execution_result']['return_code'] == 0
          assert data['authority_reason']
          PY
      - name: Commit permanent closure and self-delete
        run: |
          rm .github/workflows/step15-memory-gap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: record Docker memory-limit semantics'
          git push origin HEAD:step15-docker-backend
