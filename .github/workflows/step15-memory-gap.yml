name: Step 15 memory closure

on:
  push:
    branches:
      - step15-docker-backend

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-docker-backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply patch
        run: python scripts/patch_step15_memory.py
      - name: Validate
        run: |
          ruff format src/lidarperf/backends/docker.py tests/backends/test_docker.py scripts/run_step15_docker_validation.py
          ruff check .
          pytest
          docker pull alpine:3.20
          python scripts/run_step15_docker_validation.py
          python -c "import json; d=json.load(open('docs/validation/step15_docker_backend.json')); assert d['execution_metadata']['container']['memory_limit_bytes']==67108864; assert d['validation']['memory_limit_bytes']==67108864; assert d['execution_result']['return_code']==0"
      - name: Commit and self-delete
        run: |
          rm scripts/patch_step15_memory.py .github/workflows/step15-memory-gap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: record Docker memory-limit semantics'
          git push origin HEAD:step15-docker-backend
