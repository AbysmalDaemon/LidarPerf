name: Step 15 post-merge closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step15-postmerge-log.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append closure and self-delete
        run: |
          echo '' | base64 -d >> LidarPerf_research_execution_plan.md
          rm .github/workflows/step15-postmerge-log.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close Step 15 post-merge history'
          git push origin HEAD:main
