name: Step 16 real Docker estimator validation

on:
  push:
    branches:
      - step16-real-docker-estimator
    paths:
      - .github/workflows/step16-real-docker-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EVALIO_DATA: ${{ github.workspace }}/.evalio_data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step16-real-docker-estimator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install LidarPerf with evalio
        run: python -m pip install -e '.[dev,evalio]'
      - name: Download real Hilti sequence
        run: evalio dl hilti_2022/basement_2
      - name: Produce native evalio reference path
        run: evalio run -o .step16-evalio -d hilti_2022/basement_2 -p kiss -l 120
      - name: Build pinned KISS validation image
        run: docker build -t lidarperf-step16-kiss:1.3.0 docker/validation/kiss-evalio
      - name: Execute real estimator through DockerBackend
        run: |
          python scripts/run_step16_real_docker_kiss.py \
            --evalio-results .step16-evalio \
            --dataset hilti_2022/basement_2 \
            --pipeline kiss \
            --length 120 \
            --image lidarperf-step16-kiss:1.3.0 \
            --output docs/validation/step16_docker_kiss_hilti.json
      - name: Validate permanent code and evidence
        run: |
          ruff check .
          pytest
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/validation/step16_docker_kiss_hilti.json')
          data = json.loads(path.read_text())
          assert data['schema_version'] == 'lidarperf.step16-docker-kiss-validation.v1'
          assert data['performance_authoritative'] is False
          assert data['dataset']['requested_lidar_scans'] == 120
          assert data['estimator']['version'] == '1.3.0'
          assert data['docker_result']['pose_count'] == 120
          assert data['container']['return_code'] == 0
          assert data['container']['execution_metadata']['container']['network'] == 'none'
          assert data['container']['execution_metadata']['container']['memory_limit_bytes'] == 2147483648
          assert data['container']['execution_metadata']['container']['cpu_allocation']
          PY
      - name: Commit durable evidence and self-delete
        run: |
          rm .github/workflows/step16-real-docker-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/validation/step16_docker_kiss_hilti.json .github/workflows/step16-real-docker-validation.yml
          git commit -m 'test: record real Docker KISS Hilti evidence'
          git push origin HEAD:step16-real-docker-estimator
