name: Step 16 real Docker estimator validation

on:
  push:
    branches:
      - step16-real-docker-estimator
    paths:
      - .github/workflows/step16-real-docker-validation.yml
      - docker/validation/kiss-kitti/**
      - scripts/run_step16_real_docker_kiss.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step16-real-docker-estimator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install LidarPerf
        run: python -m pip install -e '.[dev]'
      - name: Download compact real KITTI sequence 00 fixture
        run: |
          mkdir -p .step16-source
          wget --https-only --secure-protocol=TLSv1_2 \
            -O .step16-source/kitti_example.tar.gz \
            https://uni-bonn.sciebo.de/s/KwOuBiPZi8vSz2O/download
          tar -xf .step16-source/kitti_example.tar.gz -C .step16-source
          find .step16-source -maxdepth 5 -type f | sort | head -80
      - name: Build pinned KISS validation image
        run: docker build -t lidarperf-step16-kiss:1.3.0 docker/validation/kiss-kitti
      - name: Execute real estimator through DockerBackend
        run: |
          set +e
          python scripts/run_step16_real_docker_kiss.py \
            --source .step16-source \
            --archive .step16-source/kitti_example.tar.gz \
            --length 100 \
            --image lidarperf-step16-kiss:1.3.0 \
            --output docs/validation/step16_docker_kiss_kitti.json \
            2>&1 | tee .step16-failure.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp .step16-failure.log docs/validation/step16_failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/validation/step16_failure.log
            git commit -m 'test: retain Step 16 failure diagnostic'
            git push origin HEAD:step16-real-docker-estimator
            exit "$status"
          fi
      - name: Validate permanent code and evidence
        run: |
          ruff check .
          pytest
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/validation/step16_docker_kiss_kitti.json')
          data = json.loads(path.read_text())
          assert data['schema_version'] == 'lidarperf.step16-docker-kiss-kitti-validation.v1'
          assert data['performance_authoritative'] is False
          assert data['dataset']['dataset'] == 'KITTI Odometry'
          assert data['dataset']['sequence'] == '00'
          assert data['dataset']['scan_count'] == 100
          assert data['estimator']['version'] == '1.3.0'
          assert data['result']['estimate_pose_count'] == 100
          assert data['result']['reference_pose_count'] == 100
          assert data['result']['metrics']['association.matched_pose_count'] == 100
          assert data['container']['return_code'] == 0
          container = data['container']['execution_metadata']['container']
          assert container['network'] == 'none'
          assert container['memory_limit_bytes'] == 2147483648
          assert container['cpu_allocation']
          PY
      - name: Commit durable evidence and self-delete
        run: |
          rm -f docs/validation/step16_failure.log
          rm .github/workflows/step16-real-docker-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/validation/step16_docker_kiss_kitti.json docs/validation/step16_failure.log .github/workflows/step16-real-docker-validation.yml
          git commit -m 'test: record real Docker KISS KITTI evidence'
          git push origin HEAD:step16-real-docker-estimator
