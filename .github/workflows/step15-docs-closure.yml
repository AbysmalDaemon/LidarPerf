name: Step 15 docs closure

on:
  push:
    branches:
      - step15-docker-backend

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step15-docker-backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply docs and remove helper
        run: |
          python scripts/patch_step15_docs.py
          rm scripts/patch_step15_docs.py
      - name: Validate permanent tree
        run: |
          ruff check .
          pytest
          python -c "import json; d=json.load(open('docs/validation/step15_docker_backend.json')); assert d['execution_metadata']['container']['memory_limit_bytes']==67108864"
      - name: Commit and self-delete
        run: |
          rm .github/workflows/step15-docs-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close Step 15 implementation record'
          git push origin HEAD:step15-docker-backend
