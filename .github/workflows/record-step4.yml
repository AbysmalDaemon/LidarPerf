name: Validate and record Step 4

on:
  push:
    branches: [result-bundles]

permissions:
  contents: write

jobs:
  validate-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: result-bundles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Append validated Step 4 record
        env:
          STEP4_LOG_B64: '.