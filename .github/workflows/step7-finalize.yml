name: Finalize Step 7

on:
  push:
    branches: [trajectory-metrics]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply protocol and metric refinements
        run: python scripts/step7_finalize.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Regenerate protocol schema
        run: python scripts/export_schemas.py
      - name: Refresh protocol hashes
        run: python scripts/step7_finalize.py --hashes
      - name: Apply Ruff safe fixes
        run: ruff check . --fix --exclude scripts/step7_finalize.py
      - name: Lint
        run: ruff check . --exclude scripts/step7_finalize.py
      - name: Test
        run: pytest
      - name: Finalize branch
        run: |
          cat scripts/step7_log_entry.md >> LidarPerf_research_execution_plan.md
          git rm scripts/step7_finalize.py scripts/step7_log_entry.md .github/workflows/step7-finalize.yml
          git add pyproject.toml src/lidarperf/spec/models.py protocols/lo/se3_v1.yaml protocols/lio/se3_v1.yaml SPEC.md tests/spec/test_models.py README.md src/lidarperf/trajectory tests/trajectory schemas/protocol-v0.1.0.schema.json LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finalize protocol-scoped trajectory metrics'
          git push
