name: Step 14 post-merge closure

on:
  push:
    branches: [main]
    paths: [.github/workflows/step14-postmerge-log.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      CLOSURE_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append closure and remove one-shot workflow
        run: |
          python -c "import base64, os; from pathlib import Path; p=Path('LidarPerf_research_execution_plan.md'); p.write_bytes(p.read_bytes()+base64.b64decode(os.environ['CLOSURE_B64']))"
          git rm .github/workflows/step14-postmerge-log.yml
          git add LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Step 14 execution history'
          git push origin HEAD:main
