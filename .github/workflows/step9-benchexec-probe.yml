name: Step 9 BenchExec capability probe

on:
  push:
    branches: [step9-end-to-end]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BenchExec Ubuntu package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
      - name: Delegate cpuset and verify runexec
        run: |
          uid="$(id -u)"
          subtree="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service/cgroup.subtree_control"
          if [ -w "$subtree" ]; then
            echo +cpuset > "$subtree"
          else
            echo +cpuset | sudo tee "$subtree"
          fi
          python3 -m benchexec.check_cgroups
          runexec --no-container --output /tmp/probe.log -- /bin/true
          cat /tmp/probe.log
