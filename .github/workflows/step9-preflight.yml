name: Step 9 preflight

on:
  push:
    branches: [step9-end-to-end]

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show Ruff import fix
        run: |
          python -m pip install -e '.[dev]'
          ruff check tests/test_runner.py --fix
          sed -n '1,30p' tests/test_runner.py
      - name: Install BenchExec Ubuntu package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
      - name: Verify nested cpuset delegation
        run: |
          uid="$(id -u)"
          base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
          echo +cpuset | sudo tee "$base/cgroup.subtree_control"
          systemd-run --user --scope --slice=benchexec -p Delegate=yes bash -lc '
            uid="$(id -u)"
            base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
            echo +cpuset | sudo tee "$base/benchexec.slice/cgroup.subtree_control"
            python3 -m benchexec.check_cgroups
            runexec --no-container --output /tmp/probe.log -- /bin/true
            cat /tmp/probe.log
          '
