name: Step 13 report closure

on:
  push:
    branches: [step13-reporting]
    paths:
      - '.github/workflows/step13-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step13-reporting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Generate durable report and documentation
        run: |
          python scripts/run_step13_validation.py
          python scripts/_step13_finalize.py
      - name: Remove closure scaffolding and validate permanent tree
        run: |
          git rm .github/workflows/step13-finalize.yml scripts/_step13_finalize.py
          ruff check .
          pytest -q
          python scripts/run_step13_validation.py
      - name: Commit closure
        run: |
          git add \
            README.md \
            LidarPerf_research_execution_plan.md \
            docs/validation/README.md \
            docs/validation/step13_kiss_hilti_report.html \
            docs/validation/step13_kiss_hilti_report.json \
            scripts/run_step13_validation.py \
            tests/test_report.py \
            src/lidarperf/report.py \
            src/lidarperf/report_cli.py \
            src/lidarperf/cli.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Step 13 reporting implementation'
          git push origin HEAD:step13-reporting
