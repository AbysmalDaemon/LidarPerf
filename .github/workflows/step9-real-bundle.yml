name: Step 9 real LidarPerf bundle

on:
  push:
    branches: [step9-end-to-end]

permissions:
  contents: write

jobs:
  real-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EVALIO_DATA: ${{ github.workspace }}/.step9_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install LidarPerf + evalio
        run: python -m pip install -e '.[dev,evalio]'
      - name: Cheap code gates
        run: |
          ruff check .
          pytest
      - name: Install official BenchExec package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
          runexec --version
      - name: Download real Hilti sequence
        run: evalio dl hilti_2022/basement_2
      - name: Produce verified real bundle under BenchExec-capable scope
        run: |
          uid="$(id -u)"
          base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
          echo +cpuset | sudo tee "$base/cgroup.subtree_control"
          systemd-run --user --scope --slice=benchexec -p Delegate=yes bash -lc '
            uid="$(id -u)"
            base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
            echo +cpuset | sudo tee "$base/benchexec.slice/cgroup.subtree_control"
            python scripts/run_step9_real.py \
              --bundle docs/validation/step9_kiss_hilti.lperf \
              --workspace .step9_work \
              --length 120
          '
      - name: Independently verify bundle
        run: |
          lidarperf verify docs/validation/step9_kiss_hilti.lperf
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/validation/step9_kiss_hilti.lperf')
          for name in ['manifest.json', 'environment.json', 'aggregate.json', 'trials/0001/resources.json']:
              print(f'--- {name} ---')
              print(json.dumps(json.loads((root / name).read_text()), indent=2, sort_keys=True))
          PY
      - name: Commit evidence and remove one-shot workflow
        run: |
          git rm .github/workflows/step9-real-bundle.yml
          git add -f docs/validation/step9_kiss_hilti.lperf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add first verified real LidarPerf bundle'
          git push
