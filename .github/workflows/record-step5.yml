name: Record Step 5 engineering log

on:
  push:
    branches:
      - host-doctor

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: host-doctor
      - name: Append durable Step 5 record and remove helper workflow
        env:
          STEP5_LOG_B64: ""
        run: |
          marker='## Project execution log — 2026-09-14 — Step 5 host fingerprinting and `lidarperf doctor`'
          if ! grep -Fq "$marker" LidarPerf_research_execution_plan.md; then
            printf '%s' "$STEP5_LOG_B64" | base64 --decode >> LidarPerf_research_execution_plan.md
          fi
          rm .github/workflows/record-step5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LidarPerf_research_execution_plan.md .github/workflows/record-step5.yml
          git commit -m 'docs: record Step 5 engineering log'
          git push origin HEAD:host-doctor
