name: Step 10 preflight

on:
  push:
    branches: [step10-repeated-runs]

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply pinned Ruff fixes and one line-wrap fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lidarperf/runset.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"representative first measured trial; exact argv is stored in every trial resources record"',
              '"representative first measured trial; exact argv is stored in every "\n'
              '            "trial resources record"',
          )
          path.write_text(text, encoding='utf-8')
          PY
          ruff check . --fix
      - name: Validate Step 10 core
        run: |
          ruff check .
          pytest
      - name: Commit fixes and remove one-shot preflight
        if: success()
        run: |
          git rm .github/workflows/step10-preflight.yml
          git add src/lidarperf/runset.py tests/test_repeatability.py tests/test_runset.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize Step 10 run-set core'
          git push
