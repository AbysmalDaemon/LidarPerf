name: Step 12 postmerge closure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/step12-postmerge-log.yml']
permissions:
  contents: write
jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Append and commit closure
        run: |
          echo ' ' | base64 -d >> LidarPerf_research_execution_plan.md
          git rm .github/workflows/step12-postmerge-log.yml
          git add LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Step 12 execution history'
          git push
