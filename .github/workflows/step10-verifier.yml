name: Step 10 verifier hardening

on:
  push:
    branches: [step10-repeated-runs]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Patch verifier and tamper test
        run: |
          python - <<'PY'
          from pathlib import Path

          verify = Path('src/lidarperf/bundle/verify.py')
          text = verify.read_text(encoding='utf-8')

          old = '''from lidarperf.spec import ProtocolLoadError, load_protocol, sha256_fingerprint
          from lidarperf.spec.enums import MeasurementClass
          '''
          new = '''from lidarperf.repeatability import (
              RepeatabilityError,
              scalar_distributions,
              trajectory_repeatability,
          )
          from lidarperf.spec import ProtocolLoadError, load_protocol, sha256_fingerprint
          from lidarperf.spec.enums import MeasurementClass
          from lidarperf.trajectory import TrajectoryError, parse_tum
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    successful_trials = 0
              failed_trials = 0
              for trial_index in range(1, manifest.trial_count + 1):
          '''
          new = '''    successful_trials = 0
              failed_trials = 0
              successful_metric_records: list[dict[str, Any]] = []
              successful_resource_records: list[dict[str, Any]] = []
              successful_trajectories = []
              for trial_index in range(1, manifest.trial_count + 1):
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        trial = _load_json(root / directory / "trial.json", TrialRecord, collector, "TRIAL_INVALID")
                  _load_json(root / directory / "metrics.json", MetricsRecord, collector, "METRICS_INVALID")
                  _load_json(
                      root / directory / "resources.json", ResourcesRecord, collector, "RESOURCES_INVALID"
                  )
                  if trial is not None:
                      if trial.trial_index != trial_index:
                          collector.error(
                              "TRIAL_INDEX_MISMATCH",
                              f"{directory}/trial.json has trial_index={trial.trial_index}",
                          )
                      if trial.status == TrialStatus.SUCCESS:
                          successful_trials += 1
                      else:
                          failed_trials += 1
          '''
          new = '''        trial = _load_json(root / directory / "trial.json", TrialRecord, collector, "TRIAL_INVALID")
                  metrics = _load_json(
                      root / directory / "metrics.json", MetricsRecord, collector, "METRICS_INVALID"
                  )
                  resources = _load_json(
                      root / directory / "resources.json", ResourcesRecord, collector, "RESOURCES_INVALID"
                  )
                  if trial is not None:
                      if trial.trial_index != trial_index:
                          collector.error(
                              "TRIAL_INDEX_MISMATCH",
                              f"{directory}/trial.json has trial_index={trial.trial_index}",
                          )
                      if trial.status == TrialStatus.SUCCESS:
                          successful_trials += 1
                          if metrics is not None:
                              successful_metric_records.append(metrics.values)
                          if resources is not None:
                              successful_resource_records.append(resources.values)
                          trajectory_path = root / directory / "trajectory.tum"
                          if trajectory_path.is_file() and resolved_protocol is not None:
                              try:
                                  successful_trajectories.append(
                                      parse_tum(
                                          trajectory_path.read_text(encoding="utf-8"),
                                          body_frame=resolved_protocol.trajectory.evaluation_frame,
                                      )
                                  )
                              except (OSError, TrajectoryError) as exc:
                                  collector.error(
                                      "TRAJECTORY_INVALID",
                                      f"{directory}/trajectory.tum: {exc}",
                                  )
                      else:
                          failed_trials += 1
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if aggregate.successful_trials + aggregate.failed_trials != manifest.trial_count:
                  collector.error(
                      "AGGREGATE_TRIAL_COUNT_MISMATCH",
                      "aggregate trial counts do not match manifest trial_count",
                  )

              return collector.report()
          '''
          new = '''        if aggregate.successful_trials + aggregate.failed_trials != manifest.trial_count:
                  collector.error(
                      "AGGREGATE_TRIAL_COUNT_MISMATCH",
                      "aggregate trial counts do not match manifest trial_count",
                  )

              if aggregate is not None and manifest.trial_count > 1:
                  if aggregate.metrics.get("summary_schema") != "lidarperf.repeatability.v1":
                      collector.error(
                          "AGGREGATE_REPEATABILITY_SCHEMA_MISSING",
                          "multi-trial bundles require lidarperf.repeatability.v1 aggregate summaries",
                      )
                  expected_metric_distributions = scalar_distributions(successful_metric_records)
                  if aggregate.metrics.get("trial_metrics") != expected_metric_distributions:
                      collector.error(
                          "AGGREGATE_METRIC_DISTRIBUTION_MISMATCH",
                          "aggregate trial-metric distributions do not match measured trial payloads",
                      )
                  expected_resource_distributions = scalar_distributions(successful_resource_records)
                  if aggregate.metrics.get("resources") != expected_resource_distributions:
                      collector.error(
                          "AGGREGATE_RESOURCE_DISTRIBUTION_MISMATCH",
                          "aggregate resource distributions do not match measured trial payloads",
                      )
                  if len(successful_trajectories) >= 2:
                      try:
                          expected_repeatability = trajectory_repeatability(successful_trajectories)
                      except RepeatabilityError as exc:
                          collector.error("TRAJECTORY_REPEATABILITY_INVALID", str(exc))
                      else:
                          if aggregate.metrics.get("trajectory_repeatability") != expected_repeatability:
                              collector.error(
                                  "AGGREGATE_TRAJECTORY_REPEATABILITY_MISMATCH",
                                  "aggregate trajectory repeatability does not match trial trajectories",
                              )

              return collector.report()
          '''
          assert old in text
          text = text.replace(old, new, 1)
          verify.write_text(text, encoding='utf-8')

          tests = Path('tests/test_runset.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'from lidarperf.bundle import DatasetFingerprintClass, DatasetRecord, VerificationStatus',
              'from lidarperf.bundle import (\n'
              '    DatasetFingerprintClass,\n'
              '    DatasetRecord,\n'
              '    VerificationStatus,\n'
              '    verify_bundle,\n'
              ')',
              1,
          )
          test_text += '''\n\ndef _refresh_checksum(bundle: Path, relative_path: str) -> None:
              digest = hashlib.sha256((bundle / relative_path).read_bytes()).hexdigest()
              checksum_path = bundle / "checksums.sha256"
              lines = checksum_path.read_text(encoding="utf-8").splitlines()
              rewritten = [
                  f"{digest}  {relative_path}" if line.endswith(f"  {relative_path}") else line
                  for line in lines
              ]
              checksum_path.write_text("\\n".join(rewritten) + "\\n", encoding="utf-8")


          def test_verifier_recomputes_runset_resource_distributions(tmp_path: Path) -> None:
              bundle = tmp_path / "result.lperf"
              run_evalio_repeated_benchmark(
                  protocol_path="protocols/lo/se3_v1.yaml",
                  dataset="example/sequence",
                  pipeline="kiss",
                  length=4,
                  input_support=None,
                  dataset_record=dataset_record(),
                  algorithm_config={},
                  method_version="1.3.0",
                  bundle_dir=bundle,
                  workspace=tmp_path / "work",
                  measurement_class=MeasurementClass.CONTROLLED,
                  measured_trials=5,
                  warmup_trials=0,
                  evalio_backend=FakeEvalioBackend(),
                  execution_backend=FakeBenchExecBackend(),
              )

              aggregate_path = bundle / "aggregate.json"
              aggregate = json.loads(aggregate_path.read_text(encoding="utf-8"))
              aggregate["metrics"]["resources"]["wall_time_s"]["median"] = 999.0
              aggregate_path.write_text(
                  json.dumps(aggregate, sort_keys=True, indent=2) + "\\n",
                  encoding="utf-8",
              )
              _refresh_checksum(bundle, "aggregate.json")

              report = verify_bundle(bundle)
              assert report.status == VerificationStatus.INVALID
              assert "AGGREGATE_RESOURCE_DISTRIBUTION_MISMATCH" in {
                  issue.code for issue in report.issues
              }
          '''
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          ruff check . --fix
          ruff check .
          pytest
      - name: Commit verifier hardening
        if: success()
        run: |
          git rm .github/workflows/step10-verifier.yml
          git add src/lidarperf/bundle/verify.py tests/test_runset.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: independently verify run-set aggregates'
          git push
