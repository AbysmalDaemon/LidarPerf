name: Validate and record Step 3

on:
  push:
    branches:
      - synthetic-fixture

permissions:
  contents: write

jobs:
  validate-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: synthetic-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development environment
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Append Step 3 engineering record
        env:
          STEP3_LOG_B64: ""
        shell: bash
        run: |
          python - <<'PYLOG'
          import base64
          import os
          from pathlib import Path

          path = Path("LidarPerf_research_execution_plan.md")
          marker = "## Project execution log — 2026-09-14 — Step 3 synthetic conformance fixture"
          current = path.read_text(encoding="utf-8")
          if marker not in current:
              addition = base64.b64decode(os.environ["STEP3_LOG_B64"]).decode("utf-8")
              path.write_text(current.rstrip() + "\n\n" + addition, encoding="utf-8")
          PYLOG
      - name: Remove one-shot workflow and commit record
        shell: bash
        run: |
          rm .github/workflows/record-step3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record validated synthetic fixture implementation'
          git push origin HEAD:synthetic-fixture
