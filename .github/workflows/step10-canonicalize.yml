name: Step 10 canonical aggregate fix

on:
  push:
    branches: [step10-repeated-runs]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Canonicalize aggregate trajectory inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/runset.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from lidarperf.trajectory import EvaluationSupport, Trajectory, serialize_tum'
          new_import = 'from lidarperf.trajectory import EvaluationSupport, Trajectory, parse_tum, serialize_tum'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old = '            successful_trajectories.append(trajectory)'
          new = '''            successful_trajectories.append(
              parse_tum(
                  serialize_tum(trajectory),
                  body_frame=protocol.trajectory.evaluation_frame,
              )
          )'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_repeatability.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'from lidarperf.trajectory import Trajectory',
              'from lidarperf.trajectory import Trajectory, parse_tum, serialize_tum',
              1,
          )
          test_text += '''\n\ndef test_bundle_serialization_is_the_repeatability_authority() -> None:
              first = _trajectory()
              second = _trajectory(4.0e-13)
              raw = trajectory_repeatability([first, second])
              canonical = trajectory_repeatability(
                  [
                      parse_tum(serialize_tum(first), body_frame="body"),
                      parse_tum(serialize_tum(second), body_frame="body"),
                  ]
              )
              assert raw["maximum_pose_translation_delta_m"] > 0.0
              assert canonical["maximum_pose_translation_delta_m"] == 0.0
          '''
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Validate fix
        run: |
          python -m pip install -e '.[dev]'
          ruff check . --fix
          ruff check .
          pytest
      - name: Commit fix and remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/step10-canonicalize.yml
          git add src/lidarperf/runset.py tests/test_repeatability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: derive repeatability from canonical trajectory payloads'
          git push
