name: Step 10 restore relabeled evidence

on:
  push:
    branches: [step10-repeated-runs]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore the successful real bundle from Git history
        run: |
          git checkout 47b687709d3a0ed21a396118582e881e0107c3f5 -- docs/validation/step10_kiss_hilti_controlled.lperf
          mv docs/validation/step10_kiss_hilti_controlled.lperf docs/validation/step10_kiss_hilti_repeated.lperf
          root=docs/validation/step10_kiss_hilti_repeated.lperf
          jq '.measurement_class = "exploratory"' "$root/manifest.json" > "$root/manifest.tmp"
          mv "$root/manifest.tmp" "$root/manifest.json"
          jq '.measurement_class = "exploratory" | .execution.host_control_mode = "uncontrolled" | .execution.host_control_reason = "ordinary GitHub-hosted runner" | .execution.cpu_allocation = [] | .execution.thread_policy = "KISS-ICP evalio default; max_num_threads=0"' "$root/environment.json" > "$root/environment.tmp"
          mv "$root/environment.tmp" "$root/environment.json"
          : > "$root/checksums.sha256"
          while IFS= read -r relative; do
            digest=$(sha256sum "$root/$relative" | cut -d' ' -f1)
            printf '%s  %s\n' "$digest" "$relative" >> "$root/checksums.sha256"
          done < <(jq -r '.file_inventory[]' "$root/manifest.json")
      - name: Verify restored evidence
        run: |
          python -m pip install -e '.[dev]'
          lidarperf verify docs/validation/step10_kiss_hilti_repeated.lperf
          ruff check .
          pytest
      - name: Commit restored evidence
        run: |
          git rm .github/workflows/step10-restore-evidence.yml
          git add -A
          git add -f docs/validation/step10_kiss_hilti_repeated.lperf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: restore exploratory repeated-run evidence'
          git push
