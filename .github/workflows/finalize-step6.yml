name: Finalize Step 6 log

on:
  push:
    branches: [benchexec-backend]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Step 6 engineering log
        shell: python
        run: |
          from pathlib import Path
          entry = '''

---

## Project execution log - 2026-09-14 - Step 6 BenchExec execution backend

**Status:** implementation complete on `benchexec-backend`; pre-PR validation passed. PR review and the normal Python 3.11/3.12/3.13 CI matrix are the remaining merge gates.

### Goal and implementation

Step 6 adds the controlled Linux process-execution layer by delegating process-tree timing and resource accounting to BenchExec/`runexec` instead of writing a custom monitor. It adds versioned command, resource-limit, measurement, execution-result, and capability models; direct argv execution without a shell; wall/CPU time and peak-memory accounting; CPU/wall/memory/core/NUMA limits; return/signal/timeout/termination normalization; backend-version capture; compact diagnostics; and an active `probe_capability()` readiness check.

The backend defaults to `--no-container`; software-container semantics remain a separate planned Docker backend.

### Result-log contract

BenchExec `runexec --output` combines command stdout and stderr. LidarPerf must not invent stream separation. A trial therefore contains exactly one of `process.log` or a genuine `stdout.log` + `stderr.log` pair. Declaring both layouts is invalid. The SPEC, verifier, tests, and README were updated accordingly.

### Controlled-readiness and dependency decisions

Finding `runexec` on PATH is not enough. `BenchExecBackend.probe_capability()` executes a tiny process and requires wall time, CPU time, and process-tree memory accounting before reporting `controlled_ready=true`. GitHub-hosted runners expose `runexec` but do not provide delegated cgroups for authoritative accounting, so they remain package/unit-test hosts rather than controlled performance hosts.

The portable `benchmark` extra uses `benchexec>=3.31,<4`. A temporary attempt to force `benchexec[systemd]` failed because `pystemd` needed `libsystemd` development metadata. Systemd integration is therefore documented as benchmark-host setup, not an unconditional Python dependency.

### Validation

Final pre-PR validation on Ubuntu 24.04 / Python 3.13: BenchExec package smoke PASS (`runexec 3.35`), Ruff PASS, pytest PASS (`87 passed`). The pull-request Python 3.11/3.12/3.13 matrix remains the authoritative cross-version gate.

### Errors and learnings

1. A real `runexec` smoke on GitHub-hosted CI failed because delegated cgroups were unavailable. This was reclassified correctly as an environment-capability result and led to the active readiness probe.
2. Forcing `benchexec[systemd]` caused a `pystemd`/`libsystemd.pc` install failure. The dependency was returned to portable BenchExec and host prerequisites were documented.
3. The original bundle contract required split stdout/stderr logs, while BenchExec exposes one combined output file. The spec/verifier were changed to preserve real provenance through `process.log` rather than fabricate separation.
4. Old transfer corruption was discovered in remotely published `SPEC.md`. Several hash-driven repair attempts were too brittle and caused unnecessary failed CI runs. The repair was changed to semantic invariant checks and succeeded. Learning: validate large transferred artifacts immediately and do not use a whole-file hash as the sole repair criterion when the intended semantic changes are known.
5. One verifier test demanded `TRIAL_LOG_MISSING` in addition to the more precise `INVENTORY_MISSING` and `PAYLOAD_MISSING`. The over-specified assertion was removed.
6. The first Step 6 finalizer workflow had invalid YAML indentation, and the second used a corrupted copied base64 payload. Both were tooling mistakes in the temporary logging workflow, not product-code failures. Corrective action: use a plain Python block with ASCII text, then delete the temporary workflows in the same commit.

### Next action

Open PR #6, require the normal repository CI matrix to pass, review the diff, and merge. After merge, Step 7 is trajectory representation and structural validation.
'''
          path = Path('LidarPerf_research_execution_plan.md')
          with path.open('a', encoding='utf-8') as handle:
              handle.write(entry)
      - name: Remove temporary Step 6 workflows and commit
        run: |
          git rm .github/workflows/finalize-step6.yml .github/workflows/pre-step6.yml
          git add LidarPerf_research_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize Step 6 engineering log'
          git push
