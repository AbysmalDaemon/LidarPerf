name: Step 10 real repeated LidarPerf bundle

on:
  push:
    branches: [step10-repeated-runs]

permissions:
  contents: write

env:
  EVALIO_DATA: ${{ github.workspace }}/.step10_data

jobs:
  real-runset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install LidarPerf + evalio
        run: python -m pip install -e '.[dev,evalio]'
      - name: Cheap code gates
        run: |
          ruff check .
          pytest
      - name: Install official BenchExec package
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get update
          sudo apt-get install -y benchexec
          runexec --version
      - name: Download real Hilti sequence
        run: evalio dl hilti_2022/basement_2
      - name: Produce verified five-trial bundle under delegated BenchExec scope
        run: |
          uid="$(id -u)"
          base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
          echo +cpuset | sudo tee "$base/cgroup.subtree_control"
          systemd-run --user --scope --slice=benchexec -p Delegate=yes bash -lc '
            uid="$(id -u)"
            base="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
            echo +cpuset | sudo tee "$base/benchexec.slice/cgroup.subtree_control"
            python scripts/run_step10_real.py \
              --bundle docs/validation/step10_kiss_hilti_controlled.lperf \
              --workspace .step10_work \
              --length 120 \
              --measured-trials 5 \
              --warmup-trials 1
          '
      - name: Independently verify and print evidence
        run: |
          lidarperf verify docs/validation/step10_kiss_hilti_controlled.lperf
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/validation/step10_kiss_hilti_controlled.lperf')
          for name in ['manifest.json', 'environment.json', 'aggregate.json']:
              print(f'--- {name} ---')
              print(json.dumps(json.loads((root / name).read_text()), indent=2, sort_keys=True))
          for index in range(1, 6):
              name = f'trials/{index:04d}/resources.json'
              print(f'--- {name} ---')
              print(json.dumps(json.loads((root / name).read_text()), indent=2, sort_keys=True))
          PY
      - name: Commit evidence and remove one-shot workflow
        run: |
          git rm .github/workflows/step10-real-runset.yml
          git add -f docs/validation/step10_kiss_hilti_controlled.lperf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add first real repeated LidarPerf bundle'
          git push
