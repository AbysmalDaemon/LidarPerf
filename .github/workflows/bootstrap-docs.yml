name: Bootstrap approved docs

on:
  push:
    branches: [foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation
      - name: Assemble approved specification and project record
        run: |
          cat .bootstrap/spec/part-* > SPEC.md
          gzip -dc .bootstrap/plan.md.gz > LidarPerf_research_execution_plan.md
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-docs.yml
      - name: Commit assembled documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add approved specification and project record"
          git push origin HEAD:foundation
