name: Step 14 wire export CLI

on:
  push:
    branches: [step14-bencher-export]
    paths: [.github/workflows/step14-wire-cli.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step14-bencher-export
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire export command
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/cli.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .comparison import ComparisonError, ScalarChange, compare_bundles\n'
          import_line = 'from .export_cli import export_bencher_results\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('CLI import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          app_anchor = (
              'protocol_app = typer.Typer(help="Validate and inspect benchmark protocol documents.")\n'
              'synthetic_app = typer.Typer(help="Generate deterministic synthetic conformance fixtures.")\n'
              'app.add_typer(protocol_app, name="protocol")\n'
              'app.add_typer(synthetic_app, name="synthetic")\n'
              'app.command("report")(report_results)\n'
          )
          replacement = (
              'protocol_app = typer.Typer(help="Validate and inspect benchmark protocol documents.")\n'
              'synthetic_app = typer.Typer(help="Generate deterministic synthetic conformance fixtures.")\n'
              'export_app = typer.Typer(help="Export verified results to external benchmark formats.")\n'
              'app.add_typer(protocol_app, name="protocol")\n'
              'app.add_typer(synthetic_app, name="synthetic")\n'
              'app.add_typer(export_app, name="export")\n'
              'app.command("report")(report_results)\n'
              'export_app.command("bencher")(export_bencher_results)\n'
          )
          if 'export_app.command("bencher")' not in text:
              if app_anchor not in text:
                  raise SystemExit('CLI app anchor not found')
              text = text.replace(app_anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
      - name: Commit and remove one-shot workflow
        run: |
          git rm .github/workflows/step14-wire-cli.yml
          git add src/lidarperf/cli.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire Bencher export command'
          git push origin HEAD:step14-bencher-export
