name: Step 9 pinned Ruff fix

on:
  push:
    branches: [step9-end-to-end]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply pinned Ruff fix
        run: |
          ruff check tests/test_runner.py --fix
          git diff -- tests/test_runner.py
      - name: Remove one-shot fixer
        run: git rm .github/workflows/step9-fix-lint.yml
      - name: Validate lint
        run: ruff check .
      - name: Commit fix
        run: |
          git add tests/test_runner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize Step 9 test imports'
          git push
