name: Step 11 comparator autofix

on:
  push:
    branches: [step11-semantic-comparator]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Repair Typer option declaration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lidarperf/cli.py')
          text = path.read_text()
          old = '''    declare_change: list[str] = typer.Option(
              [],
              "--declare-change",
              help="Declare config, build_environment, or dependencies as an intentional change.",
          ),
          '''
          if old not in text:
              old = '''    declare_change: list[str] = typer.Option(
                  [],
                  "--declare-change",
                  help="Declare config, build_environment, or dependencies as an intentional change.",
              ),
              '''
          new = '''    declare_change: Annotated[
              list[str] | None,
              typer.Option(
                  "--declare-change",
                  help="Declare config, build_environment, or dependencies as an intentional change.",
              ),
          ] = None,
          '''
          if old not in text:
              raise SystemExit('could not find declare_change option block')
          text = text.replace(old, new, 1)
          text = text.replace(
              'declared_differences=set(declare_change),',
              'declared_differences=set(declare_change or ()),'
              1,
          )
          path.write_text(text)
          PY
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          ruff format src/lidarperf/cli.py src/lidarperf/comparison.py tests/test_comparison.py tests/test_cli.py
          ruff check . --fix
          ruff check .
          pytest
          lidarperf compare docs/validation/step9_kiss_hilti.lperf docs/validation/step10_kiss_hilti_repeated.lperf
      - name: Commit validated fix
        run: |
          git rm .github/workflows/step11-autofix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate semantic comparator implementation'
          git push
