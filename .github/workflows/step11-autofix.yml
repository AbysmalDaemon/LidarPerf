name: Step 11 comparator validation

on:
  push:
    branches: [step11-semantic-comparator]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          ruff format src/lidarperf/cli.py src/lidarperf/comparison.py tests/test_comparison.py tests/test_cli.py
          ruff check . --fix
          ruff check .
          pytest
          lidarperf compare docs/validation/step9_kiss_hilti.lperf docs/validation/step10_kiss_hilti_repeated.lperf
      - name: Commit validated formatting
        run: |
          git rm .github/workflows/step11-autofix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate semantic comparator implementation'
          git push
