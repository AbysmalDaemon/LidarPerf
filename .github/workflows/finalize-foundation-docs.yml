name: Finalize foundation docs

on:
  push:
    branches: [foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation
      - name: Append publication log and normalize approved spec status
        run: |
          cat .bootstrap/plan-append-*.md >> LidarPerf_research_execution_plan.md
          python - <<'PY'
          from pathlib import Path
          path = Path('SPEC.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if line.startswith('**Status:**'):
                  lines[i] = '**Status:** Approved for implementation — Gate 1 approved 2026-09-14.**  '
                  break
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/finalize-foundation-docs.yml
      - name: Commit finalized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: finalize foundation project record"
          git push origin HEAD:foundation
