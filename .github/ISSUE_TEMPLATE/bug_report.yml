name: Bug report
description: Report reproducible incorrect behavior in LidarPerf
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command/config/result bundle needed to reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: LidarPerf version, OS, Python version, backend, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / logs
      description: Attach logs or a sanitized result bundle if possible.
