[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lidarperf"
version = "0.0.0"
description = "Conformance-aware performance regression testing for LiDAR odometry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Ayush Dasgupta" }
]
keywords = [
  "lidar",
  "odometry",
  "robotics",
  "benchmarking",
  "performance",
  "slam",
  "regression-testing"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  # Pin schema/lint/test tooling so generated artifacts and CI do not drift silently.
  "pydantic==2.13.5",
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[project.scripts]
lidarperf = "lidarperf.cli:app"

[project.urls]
Homepage = "https://github.com/AbysmalDaemon/LidarPerf"
Repository = "https://github.com/AbysmalDaemon/LidarPerf"
Issues = "https://github.com/AbysmalDaemon/LidarPerf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
